<VirtualHost *:80>
    ServerName cite-events.duckdns.org
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^/?$ https://cite-events.duckdns.org/ITEventManagement/ [R=302,L]
    RewriteRule ^ https://cite-events.duckdns.org%{REQUEST_URI} [R=301,L,NE]

    <Directory /var/www/html>
        Options +FollowSymLinks -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cite-events-error.log
    CustomLog ${APACHE_LOG_DIR}/cite-events-access.log combined
</VirtualHost>
