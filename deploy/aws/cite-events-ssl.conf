<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cite-events.duckdns.org
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteRule ^/?$ /ITEventManagement/ [R=302,L]

    <Directory /var/www/html>
        Options +FollowSymLinks -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/ITEventManagement>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /srv/cite-events/releases>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /srv/cite-events/shared/uploads>
        Options +FollowSymLinks -Indexes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    <LocationMatch "^/ITEventManagement/(?:database|\.git|deploy)(?:/|$)">
        Require all denied
    </LocationMatch>

    <LocationMatch "(?i)^/ITEventManagement/assets/uploads/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh|shtml)$">
        Require all denied
    </LocationMatch>

    <FilesMatch "(?i)^(?:db_connect|test-.*|migrate_.*|reset-.*)\.php$">
        Require all denied
    </FilesMatch>

    <FilesMatch "(?i)\.(?:sql|sqlite|sqlite3|db|pem|key|log|bak|md)$">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=604800"
    Header always set Permissions-Policy "camera=(self), geolocation=(self), microphone=()"
    Header always unset X-Powered-By

    ErrorLog ${APACHE_LOG_DIR}/cite-events-error.log
    CustomLog ${APACHE_LOG_DIR}/cite-events-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/cite-events.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cite-events.duckdns.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
