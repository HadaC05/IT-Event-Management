<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../../">
  <title>SBO Media | CITE Events</title>
  <link rel="icon" href="assets/images/cite_favicon.png">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/sbo.css?v=20260915-4">
  <script src="js/shared/notifications.js" defer></script>
</head>
<body class="min-h-screen bg-white font-sans text-[#121017] antialiased">
  <div data-sbo-sidebar-host></div><div data-sbo-header-host></div>
  <main class="mx-auto max-w-[1180px] px-4 pb-28 pt-5 sm:px-6 lg:ml-20 lg:px-8">
    <header>
      <p class="text-xs font-black uppercase tracking-wider text-[#397565]">Assigned event coverage</p>
      <h1 class="mt-2 text-3xl font-black">Media</h1>
      <p class="mt-2 text-sm text-[#121017]/55">Share photos from your assigned event and activity.</p>
    </header>
    <div class="sbo-media-layout mt-5 grid gap-5">
      <form class="grid content-start gap-4 rounded-2xl border border-[#121017]/10 bg-white p-5 shadow-sm" enctype="multipart/form-data" data-media-form>
        <h2 class="text-lg font-black">Create a post</h2>
        <input type="hidden" name="action" value="create">
        <input type="hidden" name="id">
        <label class="grid gap-2"><span class="text-sm font-bold">Media assignment</span><select class="h-12 rounded-xl border border-[#121017]/12 bg-white px-3" name="assignment_id" data-assignment></select></label>
        <label class="grid gap-2"><span class="text-sm font-bold">Caption</span><textarea class="min-h-28 rounded-xl border border-[#121017]/12 p-3" name="content" maxlength="3000" placeholder="What happened at the event?" required></textarea></label>
        <label class="grid gap-2"><span class="text-sm font-bold">Event photo</span><input class="min-w-0 rounded-xl border border-[#121017]/12 p-3 text-sm" type="file" name="image" accept="image/jpeg,image/png,image/webp"></label>
        <div class="flex flex-wrap gap-2"><button class="min-h-11 flex-1 rounded-xl bg-[#397565] px-4 text-sm font-black text-white" type="submit" data-submit>Submit post</button><button class="hidden min-h-11 rounded-xl border px-4 text-sm font-bold" type="button" data-cancel>Cancel edit</button></div>
      </form>
      <section class="min-w-0"><h2 class="mb-3 text-lg font-black">Your event posts</h2><div class="grid gap-4 sm:grid-cols-2" data-posts></div></section>
    </div>
  </main>
  <dialog class="m-auto w-[min(460px,calc(100%_-_2rem))] rounded-2xl border-0 bg-white p-0 shadow-2xl backdrop:bg-[#121017]/60" data-confirm-dialog>
    <div class="p-6">
      <h2 class="text-xl font-black" data-confirm-title></h2>
      <p class="mt-2 text-sm text-[#121017]/55" data-confirm-message></p>
      <div class="mt-6 flex justify-end gap-2">
        <button class="min-h-11 rounded-xl border px-4" type="button" data-confirm-cancel>Cancel</button>
        <button class="min-h-11 rounded-xl bg-[#397565] px-4 font-black text-white" type="button" data-confirm-accept>Confirm</button>
      </div>
    </div>
  </dialog>
  <div class="pointer-events-none fixed right-4 top-4 grid w-[min(380px,calc(100%_-_2rem))] gap-3" style="z-index:100" data-notification-region></div>
  <script src="js/vendor/axios.min.js"></script>
  <script src="js/sbo/portal.js"></script>
  <script src="js/sbo/media.js"></script>
</body>
</html>
