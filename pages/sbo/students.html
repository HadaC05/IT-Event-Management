<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <base href="../../">
    <title>Assigned Students | CITE Events</title>
    <link rel="icon" href="assets/images/cite_favicon.png">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/sbo.css?v=20260919-full-width-layout">
    <script src="js/shared/notifications.js?v=20260917-7" defer></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-white font-sans text-[#121017] antialiased" data-navigation-role="sbo">
    <div data-sbo-sidebar-host></div>
    <div data-sbo-header-host></div>

    <main class="w-auto max-w-none px-4 pb-28 pt-5 transition-[margin] duration-200 sm:px-6 lg:ml-20 lg:px-8">
        <header>
            <p class="text-[10px] font-black uppercase tracking-[.14em] text-[#397565] sm:text-xs">Assigned roster</p>
            <h1 class="mt-2 text-3xl font-black tracking-tight sm:text-4xl">Students</h1>
            <p class="mt-2 max-w-2xl text-sm leading-6 text-[#121017]/55">Only students in your assigned event and team are shown.</p>
        </header>

        <section class="mt-6 overflow-hidden rounded-2xl border border-[#121017]/10 bg-white shadow-sm sm:mt-7">
            <form class="grid gap-3 border-b border-[#121017]/8 bg-[#F3F0E9]/35 p-4 sm:grid-cols-3 sm:p-5" data-filters>
                <label class="grid gap-1.5"><span class="text-[10px] font-black uppercase tracking-wider text-[#397565]">Assignment</span><select class="h-12 min-w-0 rounded-xl border border-[#121017]/12 bg-white px-3 text-sm outline-none focus:border-[#397565]" name="assignment_id" data-assignment></select></label>
                <label class="grid gap-1.5"><span class="text-[10px] font-black uppercase tracking-wider text-[#397565]">Search</span><input class="h-12 min-w-0 rounded-xl border border-[#121017]/12 bg-white px-3 text-sm outline-none focus:border-[#397565]" name="search" placeholder="Name or Student ID"></label>
                <label class="grid gap-1.5"><span class="text-[10px] font-black uppercase tracking-wider text-[#397565]">Attendance</span><select class="h-12 min-w-0 rounded-xl border border-[#121017]/12 bg-white px-3 text-sm outline-none focus:border-[#397565]" name="status"><option value="">All attendance</option><option value="present">Recorded</option><option value="not_recorded">Not recorded</option></select></label>
            </form>
            <p class="hidden border-b border-[#397565]/15 bg-[#C6F24E]/20 px-4 py-3 text-sm text-[#397565] sm:px-5" data-upcoming-assignment-notice><strong>Upcoming assignment.</strong> This roster is for an upcoming event; attendance will be available once its scheduled session opens.</p>
            <div data-student-results></div>
            <footer class="hidden items-center justify-between gap-3 border-t border-[#121017]/8 px-4 py-4 text-xs text-[#121017]/50 sm:px-5" data-student-pagination></footer>
        </section>
    </main>

    <div class="pointer-events-none fixed right-4 top-4 grid w-[min(380px,calc(100%_-_2rem))] gap-3" style="z-index:100" data-notification-region></div>
    <script src="js/vendor/axios.min.js"></script>
    <script src="js/shared/password-gate.js?v=20260917-1"></script>
    <script src="js/shared/navigation.js?v=20260917-portal-flat-1"></script>
    <script src="js/sbo/portal.js?v=20260917-1"></script>
    <script src="js/sbo/students.js?v=20260922-paginated-roster-1"></script>
</body>
</html>
