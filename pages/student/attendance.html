<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../">
    <title>Attendance | CITE Events</title>
    <link rel="icon" type="image/png" href="assets/images/cite_favicon.png">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/student-experience.css?v=20260924-attendance-cleanup-1">
    <script src="js/vendor/axios.min.js" defer></script>
    <script src="js/shared/password-gate.js?v=20260917-1"></script>
    <script src="js/shared/navigation.js?v=20260924-public-profiles-1" defer></script>
    <script src="js/student/portal.js?v=20260915-2" defer></script>
    <script src="js/student/attendance.js?v=20260924-attendance-cleanup-1" defer></script>
</head>
<body class="min-h-screen bg-[#F7F4ED] font-sans text-[#121017] antialiased" data-navigation-role="student" data-student-page="attendance">
    <div data-student-sidebar-host></div>
    <div data-student-header-host></div>

    <main class="w-auto pb-28 transition-[margin] duration-200 lg:ml-20 lg:pb-10" data-student-main data-student-sidebar-content>
        <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:py-10">
            <header class="student-stage">
                <h1 class="student-stage__title">Attendance</h1>
                <p class="student-stage__copy"><span data-attendance-greeting>Good day</span><span class="mx-2 text-white/45" aria-hidden="true">·</span><span data-attendance-date></span></p>
            </header>

            <section class="mt-7 scroll-mt-6 overflow-hidden rounded-3xl border border-[#397565]/20 bg-white shadow-[0_18px_55px_rgba(18,16,23,.05)]" id="attendance-qr" aria-labelledby="student-attendance-action-heading">
                <header class="flex items-center justify-between gap-4 border-b border-[#397565]/10 px-5 py-4 sm:px-7">
                    <h2 class="text-lg font-black" id="student-attendance-action-heading">Today’s attendance</h2>
                    <span class="hidden rounded-full px-3 py-1.5 text-[9px] font-black uppercase" data-attendance-state-badge></span>
                </header>
                <div class="p-5 sm:p-7" data-attendance-action>
                    <p class="text-sm text-[#121017]/50">Loading attendance…</p>
                </div>
                <footer class="flex justify-end border-t border-[#121017]/7 px-5 py-3 sm:px-7">
                    <button class="min-h-10 rounded-xl px-3 text-xs font-black text-[#397565] transition hover:bg-[#397565]/7" type="button" data-refresh-qr>Refresh QR</button>
                </footer>
            </section>

            <section class="mt-6 border-y border-[#121017]/10 py-4" aria-labelledby="student-attendance-summary-heading">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h2 class="text-[10px] font-black uppercase tracking-[.15em] text-[#121017]/45" id="student-attendance-summary-heading">Your summary</h2>
                    <span class="hidden text-[10px] font-black text-[#397565]" data-attendance-rate></span>
                </div>
                <div class="mt-3 grid grid-cols-2 gap-y-4" data-attendance-summary></div>
            </section>

            <section class="mt-8 overflow-hidden rounded-3xl border border-[#121017]/8 bg-white" aria-labelledby="student-attendance-history-heading">
                <header class="flex items-center justify-between gap-4 border-b border-[#121017]/8 p-5 sm:px-7 sm:py-5">
                    <div>
                        <h2 class="text-lg font-black" id="student-attendance-history-heading">Attendance history</h2>
                    </div>
                    <span class="rounded-full bg-[#F7F4ED] px-3 py-1.5 text-[10px] font-black" data-record-count>0 records</span>
                </header>
                <div class="divide-y divide-[#121017]/7" data-attendance-records></div>
            </section>
        </div>
    </main>
</body>
</html>
