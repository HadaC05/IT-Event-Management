<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../">
    <meta name="csrf-token" content="">
    <title>Home | CITE Events</title>
    <link rel="icon" type="image/png" href="assets/images/cite_favicon.png">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/media-feed.css?v=20260923-media-size-1">
    <link rel="stylesheet" href="css/student-experience.css?v=20260923-photo-carousel-1">
    <script src="js/vendor/axios.min.js" defer></script>
    <script src="js/shared/password-gate.js?v=20260917-1"></script>
    <script src="js/shared/navigation.js?v=20260923-notifications-1" defer></script>
    <script src="js/shared/interactions.js" defer></script>
    <script src="js/shared/notifications.js?v=20260917-7" defer></script>
</head>
<body class="student-shell app-shell min-h-screen bg-[#F7F4ED] font-sans text-[#121017] antialiased" data-student-shell data-navigation-role="student" data-student-page="home">
    <span
        class="route-progress"
        data-route-progress
        data-active="false"
        aria-hidden="true"
    ></span>

    <div data-student-sidebar-host></div>

    <div data-student-header-host></div>

    <main
        class="w-auto px-4 pb-28 pt-6 transition-[margin] duration-200 sm:px-6 sm:pt-8 lg:ml-20 lg:pb-10 lg:pl-6 lg:pr-5"
        data-page-content
        data-student-sidebar-content
    >
        <div class="mx-auto mb-4 flex w-full max-w-[1180px] flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div><p class="student-section-kicker">Student home</p><h1 class="text-3xl font-black tracking-tight sm:text-4xl">Campus events</h1><p class="mt-1 text-sm text-[#121017]/60">Event photos and your attendance QR, right where you need them.</p></div>
            <a class="inline-flex min-h-12 shrink-0 items-center justify-center gap-2 rounded-xl bg-[#397565] px-6 py-3 text-sm font-black text-white shadow-sm hover:bg-[#28594c] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#397565]" href="pages/student/attendance.html#attendance-qr">Attendance here <span aria-hidden="true">→</span></a>
        </div>
        <section class="student-home-carousel mx-auto mb-8 w-full max-w-[1180px]" data-student-home-carousel aria-label="Event photos" aria-roledescription="carousel">
        <div class="student-home-carousel__slides" data-home-carousel-slides>
        <header class="student-stage student-home-slide is-active" data-home-slide data-home-intro aria-labelledby="student-home-title" aria-roledescription="slide">
            <p class="student-stage__eyebrow">Campus highlights</p>
            <h2 class="student-stage__title" id="student-home-title">Events on their way.</h2>
            <p class="student-stage__copy">Event photos will appear here when they are available.</p>
            <div class="student-stage__actions">
                <a class="student-stage__action student-stage__action--primary" href="pages/student/events.html">Explore events <span aria-hidden="true">→</span></a>
            </div>
        </header>
        </div>
        <div class="student-home-carousel__controls" data-home-carousel-controls hidden>
            <button type="button" data-home-carousel-prev aria-label="Previous highlight">‹</button>
            <div class="student-home-carousel__dots" data-home-carousel-dots aria-label="Choose a highlight"></div>
            <button type="button" data-home-carousel-next aria-label="Next highlight">›</button>
        </div>
        </section>
        <div class="student-section-heading mx-auto mb-4 w-full max-w-[1180px]"><div><p class="student-section-kicker">The campus pulse</p><h2>Stories &amp; moments</h2></div></div>
        <div data-media-feed-root aria-live="polite">Loading campus stories…</div>
    </main>

    <div class="pointer-events-none fixed right-4 top-20 z-[80] grid w-[min(380px,calc(100%_-_2rem))] gap-2.5" data-notification-region aria-live="polite" aria-atomic="true"></div>
    <script src="js/shared/media-api.js?v=20260923-feed-pages-1"></script>
    <script src="js/shared/media-permissions.js?v=20260919-2"></script>
    <script src="js/shared/media-post-form.js?v=20260923-edit-preview-1"></script>
    <script src="js/shared/media-post-card.js?v=20260923-comment-replies-1"></script>
    <script src="js/student/home-carousel.js?v=20260923-photo-carousel-1"></script>
    <script src="js/shared/media-feed.js?v=20260923-home-carousel-1"></script>
    <script src="js/shared/media-page.js?v=20260919-1"></script>
</body>
</html>
