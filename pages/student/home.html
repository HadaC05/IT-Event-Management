<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../">
    <meta name="csrf-token" content="">
    <title>Home | CITE Events</title>
    <link rel="icon" type="image/png" href="assets/images/cite_favicon.png">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/media-feed.css?v=20260924-reaction-icons-1">
    <link rel="stylesheet" href="css/student-experience.css?v=20260924-responsive-media-search-2">
    <script src="js/vendor/axios.min.js" defer></script>
    <script src="js/shared/password-gate.js?v=20260917-1"></script>
    <script src="js/shared/navigation.js?v=20260924-responsive-media-search-2" defer></script>
    <script src="js/shared/interactions.js" defer></script>
    <script src="js/shared/notifications.js?v=20260917-7" defer></script>
</head>
<body class="student-shell app-shell min-h-screen bg-[#F7F4ED] font-sans text-[#121017] antialiased" data-student-shell data-navigation-role="student" data-student-page="home">
    <span
        class="route-progress"
        data-route-progress
        data-active="false"
        aria-hidden="true"
    ></span>

    <div data-student-sidebar-host></div>

    <div data-student-header-host></div>

    <main
        class="w-auto px-4 pb-28 pt-6 transition-[margin] duration-200 sm:px-6 sm:pt-8 lg:ml-20 lg:pb-10 lg:pl-6 lg:pr-5"
        data-page-content
        data-student-sidebar-content
    >
        <h1 class="sr-only">Student home</h1>
        <div class="student-home-author-search" data-student-home-search-slot></div>
        <section class="student-home-carousel mx-auto mb-8 w-full max-w-[1180px]" data-student-home-carousel aria-label="Event photos" aria-roledescription="carousel">
        <div class="student-home-carousel__slides" data-home-carousel-slides>
        <article class="student-stage student-home-slide student-home-event is-active" data-home-slide data-home-intro aria-label="Campus celebration photo" aria-roledescription="slide">
            <img class="student-home-event__poster" src="assets/uploads/event-posters/37c7f98df0ef95cc91354d6924ca0d03.jpg" alt="">
            <div class="student-home-event__content">
                <h2 class="student-stage__title">Campus moments</h2>
                <div class="student-stage__actions">
                    <a class="student-stage__action student-stage__action--primary" href="pages/student/attendance.html#attendance-qr">Attendance here <span aria-hidden="true">→</span></a>
                </div>
            </div>
        </article>
        </div>
        <div class="student-home-carousel__controls" data-home-carousel-controls hidden>
            <button type="button" data-home-carousel-prev aria-label="Previous photo">‹</button>
            <button type="button" data-home-carousel-next aria-label="Next photo">›</button>
        </div>
        </section>
        <div data-media-feed-root aria-live="polite">Loading campus stories…</div>
    </main>

    <div class="pointer-events-none fixed right-4 top-20 z-[80] grid w-[min(380px,calc(100%_-_2rem))] gap-2.5" data-notification-region aria-live="polite" aria-atomic="true"></div>
    <script src="js/shared/media-api.js?v=20260924-reaction-lists-1"></script>
    <script src="js/shared/media-permissions.js?v=20260919-2"></script>
    <script src="js/shared/media-post-form.js?v=20260923-multiple-photos-1"></script>
    <script src="js/shared/media-post-card.js?v=20260924-reaction-icons-1"></script>
    <script src="js/student/home-carousel.js?v=20260923-photo-carousel-2"></script>
    <script src="js/shared/media-feed.js?v=20260924-reaction-lists-1"></script>
    <script src="js/shared/media-page.js?v=20260919-1"></script>
</body>
</html>
