<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../">
    <title>Events | CITE Events</title>
    <link rel="icon" type="image/png" href="assets/images/cite_favicon.png">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/student-experience.css?v=20260923-1">
    <script src="js/vendor/axios.min.js" defer></script>
    <script src="js/shared/password-gate.js?v=20260917-1"></script>
    <script src="js/shared/navigation.js?v=20260924-media-merge-1" defer></script>
    <script src="js/student/portal.js" defer></script>
    <script src="js/student/events.js?v=20260923-experience-1" defer></script>
</head>
<body class="min-h-screen bg-[#F7F4ED] font-sans text-[#121017] antialiased" data-navigation-role="student" data-student-page="events">
    <div data-student-sidebar-host></div>
    <div data-student-header-host></div>

    <main class="w-auto pb-28 transition-[margin] duration-200 lg:ml-20 lg:pb-10" data-student-main data-student-sidebar-content>
        <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:py-10">
            <header class="student-stage">
                <p class="student-stage__eyebrow">CITE calendar / The line-up</p>
                <h1 class="student-stage__title">Be there for what matters.</h1>
                <p class="student-stage__copy">Your upcoming events, times, and places in one clear line-up.</p>
                <span class="student-stage__number" aria-hidden="true">02</span>
            </header>

            <section class="mt-7" aria-labelledby="active-events-heading">
                <div class="student-section-heading">
                    <div>
                        <p class="student-section-kicker">Now and next</p>
                        <h2 id="active-events-heading">Your line-up</h2>
                    </div>
                    <span class="text-xs font-bold text-[#121017]/40" data-active-count>0 events</span>
                </div>
                <div class="student-section-rule"></div>
                <div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3" data-active-events></div>
            </section>

            <section class="mt-12" aria-labelledby="past-events-heading">
                <div class="student-section-heading">
                    <div>
                        <p class="student-section-kicker">Your archive</p>
                        <h2 id="past-events-heading">The moments so far</h2>
                    </div>
                    <span class="text-xs font-bold text-[#121017]/40" data-past-count>0 events</span>
                </div>
                <div class="student-section-rule"></div>
                <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3" data-past-events></div>
            </section>
        </div>
    </main>
</body>
</html>
