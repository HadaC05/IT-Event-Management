<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/IT-Event-Management-Converted/">
    <title>CITE | Portal</title>
    <link rel="icon" href="assets/images/cite_favicon.png">
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="js/vendor/axios.min.js" defer></script>
    <script src="js/shared/portal.js" defer></script>
</head>
<body class="app-shell min-h-screen font-sans text-[#121017] antialiased">
    <header class="border-b border-[#121017]/10 bg-white/90 backdrop-blur">
        <nav class="mx-auto flex h-[72px] max-w-[1440px] items-center justify-between px-5 sm:px-8 lg:px-12">
            <a class="flex items-center gap-3 text-xl font-black tracking-[-.04em]" href="./">
                <img class="h-11 w-11 rounded-full object-contain" src="assets/images/cite-logo.png" alt="CITE logo">
                <span>CITE<span class="text-[#397565]">.</span></span>
            </a>
            <button class="rounded-lg border border-[#121017]/12 bg-white px-4 py-2 text-sm font-extrabold text-[#397565]" type="button" data-logout>Sign out</button>
        </nav>
    </header>
    <main class="mx-auto max-w-[1100px] px-5 py-16 sm:px-8 lg:px-12">
        <section class="rounded-2xl border border-[#121017]/10 bg-white/85 p-7 shadow-[0_20px_50px_rgba(18,16,23,.08)] sm:p-10">
            <p class="text-xs font-black uppercase tracking-[.18em] text-[#397565]" data-role>Account</p>
            <h1 class="mt-4 text-4xl font-black tracking-[-.05em] sm:text-5xl">Welcome, <span data-name>user</span>.</h1>
            <p class="mt-5 max-w-2xl text-base leading-7 text-[#121017]/58">Your authentication is working with PHP sessions, Axios, PDO, and the copied SQLite database.</p>
            <div class="mt-8 rounded-xl border border-[#2F3AE0]/15 bg-[#2F3AE0]/5 p-5 text-sm leading-6 text-[#121017]/65">
                Your role-specific dashboard is the next conversion stage. This temporary authenticated page confirms that login and logout work correctly.
            </div>
        </section>
    </main>
</body>
</html>
