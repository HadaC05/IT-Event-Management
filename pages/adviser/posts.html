<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../../">
    <meta name="csrf-token" content="">
    <title>Post Review | CITE Events</title>
    <link rel="icon" type="image/png" sizes="512x512" href="assets/images/cite_favicon.png">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/adviser.css?v=20260916-2">
    <script src="js/shared/notifications.js?v=20260917-7" defer></script>
    <script src="js/shared/interactions.js?v=20260917-3" defer></script>
</head>
<body class="app-shell min-h-screen bg-[#F3F0E9] font-sans text-[#121017] antialiased" data-admin-shell data-navigation-role="adviser">
    <span class="route-progress" data-route-progress data-active="false" aria-hidden="true"></span>

    <div data-page-loading-cloak aria-label="Loading Post Review"></div>
    <div data-shared-navigation-host></div>
    <div class="min-h-screen lg:ml-20">

        <main class="admin-main mx-auto w-full max-w-[1500px] px-4 py-7 sm:px-6 lg:px-10 lg:py-9 xl:px-16" data-page-content>
            <header class="flex flex-col gap-5 border-b border-[#121017]/10 pb-7 sm:flex-row sm:items-end sm:justify-between">
                <div>
                    <div class="flex items-center gap-2"><span class="h-2 w-2 animate-pulse rounded-full bg-[#C6F24E] ring-4 ring-[#C6F24E]/20"></span><p class="text-[10px] font-black uppercase tracking-[.17em] text-[#397565]">Community moderation</p></div>
                    <h1 class="mt-2 text-4xl font-black tracking-[-.045em] sm:text-5xl">Post Review</h1>
                    <p class="mt-2 max-w-2xl text-sm text-[#121017]/50">Review student posts before they appear in the community.</p>
                </div>
                <div class="flex items-center gap-2 self-start sm:self-auto"><span class="rounded-full bg-[#C6F24E]/30 px-4 py-2 text-xs font-black text-[#397565]" data-pending-count>— waiting</span><span class="text-[9px] font-black uppercase tracking-[.18em] text-[#397565]">Live</span></div>
            </header>

            <section class="mt-6 overflow-hidden rounded-3xl border border-[#121017]/10 bg-white shadow-[0_22px_60px_rgba(18,16,23,.07)]" aria-label="Post moderation workspace">
                <header class="border-b border-[#121017]/9 px-4 pt-4 sm:px-6 sm:pt-5">
                    <div class="flex flex-col gap-4 xl:flex-row xl:items-center xl:justify-between">
                        <div class="flex gap-1 overflow-x-auto" role="tablist" aria-label="Post status">
                            <button class="shrink-0 rounded-xl px-4 py-2.5 text-xs font-black transition" type="button" role="tab" data-status-tab="pending" aria-selected="true">Pending <span class="ml-1 rounded-full bg-[#C6F24E] px-2 py-0.5 text-[9px] text-[#121017]" data-status-count="pending">0</span></button>
                            <button class="shrink-0 rounded-xl px-4 py-2.5 text-xs font-black text-[#121017]/45 transition hover:bg-[#121017]/5" type="button" role="tab" data-status-tab="approved" aria-selected="false">Approved <span class="ml-1 text-[9px]" data-status-count="approved">0</span></button>
                            <button class="shrink-0 rounded-xl px-4 py-2.5 text-xs font-black text-[#121017]/45 transition hover:bg-[#121017]/5" type="button" role="tab" data-status-tab="rejected" aria-selected="false">Rejected <span class="ml-1 text-[9px]" data-status-count="rejected">0</span></button>
                        </div>
                        <div class="flex gap-2 pb-4 xl:pb-0">
                            <button class="inline-flex min-h-10 items-center gap-2 rounded-xl border border-[#121017]/10 px-4 text-xs font-black text-[#121017]/60 hover:border-[#397565]/30 hover:text-[#397565]" type="button" data-search-toggle aria-expanded="false"><svg class="h-4 w-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search</button>
                            <button class="inline-flex min-h-10 items-center gap-2 rounded-xl border border-[#121017]/10 px-4 text-xs font-black text-[#121017]/60 hover:border-[#397565]/30 hover:text-[#397565]" type="button" data-filter-toggle aria-expanded="false"><svg class="h-4 w-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4"/></svg>Filter <span class="hidden h-2 w-2 rounded-full bg-[#FF6B2C]" data-filter-active></span></button>
                        </div>
                    </div>
                    <form class="hidden grid gap-3 border-t border-[#121017]/8 py-4 lg:grid-cols-4" data-filter-form>
                        <label class="relative hidden lg:col-span-2" data-search-field><span class="sr-only">Search posts</span><svg class="absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 fill-none stroke-[#121017]/35 stroke-2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="h-11 w-full rounded-xl border border-[#121017]/10 bg-[#F3F0E9]/35 pl-11 pr-4 text-xs outline-none focus:border-[#397565] focus:ring-4 focus:ring-[#397565]/8" name="search" type="search" placeholder="Search student, post, event…"></label>
                        <label class="grid gap-1" data-filter-field><span class="text-[9px] font-black uppercase tracking-wider text-[#121017]/35">Category</span><select class="h-11 rounded-xl border border-[#121017]/10 bg-white px-3 text-xs font-bold" name="category"><option value="">All categories</option></select></label>
                        <label class="grid gap-1" data-filter-field><span class="text-[9px] font-black uppercase tracking-wider text-[#121017]/35">Submitted</span><select class="h-11 rounded-xl border border-[#121017]/10 bg-white px-3 text-xs font-bold" name="period"><option value="">Any time</option><option value="today">Today</option><option value="7_days">Last 7 days</option><option value="30_days">Last 30 days</option></select></label>
                        <label class="grid gap-1" data-filter-field><span class="text-[9px] font-black uppercase tracking-wider text-[#121017]/35">Sort</span><select class="h-11 rounded-xl border border-[#121017]/10 bg-white px-3 text-xs font-bold" name="sort"><option value="oldest">Oldest first</option><option value="newest">Newest first</option></select></label>
                        <div class="flex items-end gap-2 lg:col-span-full lg:justify-end"><button class="min-h-10 px-3 text-xs font-black text-[#121017]/45" type="button" data-clear-filters>Clear</button><button class="min-h-10 rounded-xl bg-[#397565] px-5 text-xs font-black text-white" type="submit">Apply filters</button></div>
                    </form>
                </header>

                <div class="grid xl:grid-cols-[430px_minmax(0,1fr)]">
                    <aside class="border-b border-[#121017]/9 bg-[#F3F0E9]/25 xl:border-b-0 xl:border-r" aria-label="Post queue">
                        <div class="flex items-center justify-between border-b border-[#121017]/8 px-5 py-4"><div><p class="text-[9px] font-black uppercase tracking-[.16em] text-[#397565]" data-queue-eyebrow>Waiting for review</p><p class="mt-1 text-xs text-[#121017]/40" data-result-summary>Loading posts…</p></div><span class="h-2 w-2 rounded-full bg-[#C6F24E]" data-queue-dot></span></div>
                        <div class="max-h-[590px] overflow-y-auto p-3" data-post-queue><div class="grid min-h-48 place-items-center text-xs font-bold text-[#121017]/35">Loading queue…</div></div>
                        <nav class="hidden items-center justify-between border-t border-[#121017]/8 px-4 py-3 text-[10px]" data-pagination></nav>
                    </aside>
                    <section class="relative min-w-0 bg-white" data-post-preview aria-live="polite"><div class="grid min-h-72 place-items-center px-8 text-center"><div><span class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-[#397565]/8 text-[#397565]"><svg class="h-6 w-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 4V5Zm4 4h8m-8 4h5"/></svg></span><h2 class="mt-4 text-lg font-black">Select a post</h2><p class="mt-1 text-sm text-[#121017]/40">Choose an item from the review queue.</p></div></div></section>
                </div>
            </section>
        </main>
    </div>
    <div class="pointer-events-none fixed right-4 top-4 z-[80] grid w-[min(380px,calc(100%_-_2rem))] gap-2.5 sm:right-6 sm:top-6" data-notification-region aria-live="polite" aria-atomic="true"></div>
    <script src="js/vendor/axios.min.js"></script>
    <script src="js/shared/password-gate.js?v=20260917-1"></script>
    <script src="js/shared/navigation.js?v=20260917-8"></script>
    <script src="js/adviser/posts.js?v=20260916-2"></script>
</body>
</html>
