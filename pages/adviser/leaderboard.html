<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="../../" />
    <title>Leaderboard | CITE Events</title>
    <link rel="icon" type="image/png" href="assets/images/cite_favicon.png" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/adviser.css" />
    <script src="js/shared/notifications.js?v=20260917-5" defer></script>
    <script src="js/shared/interactions.js" defer></script>
  </head>
  <body
    class="app-shell min-h-screen bg-white font-sans text-[#121017] antialiased"
    data-admin-shell data-navigation-role="adviser"
  >

    <div data-shared-navigation-host></div>
    <div class="min-h-screen lg:ml-20">

      <main
        class="admin-main mx-auto w-full max-w-[1500px] px-4 py-7 sm:px-6 lg:px-10 lg:py-9 xl:px-16"
        data-page-content
      >
        <header
          class="flex flex-col gap-5 border-b border-[#121017]/10 pb-7 lg:flex-row lg:items-end lg:justify-between"
        >
          <div>
            <p
              class="flex items-center gap-2 text-[10px] font-black uppercase tracking-[.17em] text-[#397565]"
            >
              <i
                class="h-2 w-2 rounded-full bg-[#C6F24E] ring-2 ring-[#397565]/15"
              ></i
              >Competition standings
            </p>
            <h1 class="mt-3 text-4xl font-black tracking-[-.055em] sm:text-5xl">
              Leaderboard
            </h1>
            <p class="mt-2 max-w-2xl text-sm leading-6 text-[#121017]/52">
              Compare tribe performance across scored events.
            </p>
          </div>
          <a
            class="inline-flex min-h-11 w-fit items-center justify-center gap-2 rounded-xl bg-[#397565] px-5 text-xs font-black text-white shadow-[0_10px_25px_rgba(57,117,101,.18)] transition hover:-translate-y-0.5 hover:bg-[#2f6255]"
            href="pages/adviser/scores.html"
            >Manage scores →</a
          >
        </header>

        <section
          class="mt-6"
          aria-label="Leaderboard filters"
        >
          <div class="mb-3 flex min-h-6 items-center justify-between gap-4">
            <p class="text-xs font-bold text-[#121017]/42" data-compact-summary>Loading competition totals…</p>
            <button
              class="hidden text-xs font-black text-[#397565] hover:underline"
              type="button"
              data-clear-filters
            >
              Clear filters
            </button>
          </div>
          <form
            class="grid gap-3 md:grid-cols-2 xl:grid-cols-[1.15fr_1fr_1fr_1.2fr]"
            data-leaderboard-filters
          >
            <label
              ><span
                class="sr-only"
                >Event</span
              ><select
                class="h-11 w-full rounded-xl border border-[#121017]/10 bg-white px-3 text-xs font-bold outline-none focus:border-[#397565] focus:ring-4 focus:ring-[#397565]/10"
                name="event_id"
                data-event-filter
              >
                <option value="">All scored events</option>
              </select></label
            ><label
              ><span
                class="sr-only"
                >School year</span
              ><select
                class="h-11 w-full rounded-xl border border-[#121017]/10 bg-white px-3 text-xs font-bold outline-none focus:border-[#397565] focus:ring-4 focus:ring-[#397565]/10"
                name="school_year_id"
              >
                <option value="">All school years</option>
              </select></label
            ><label
              ><span
                class="sr-only"
                >Criterion</span
              ><select
                class="h-11 w-full rounded-xl border border-[#121017]/10 bg-white px-3 text-xs font-bold outline-none disabled:cursor-not-allowed disabled:bg-[#121017]/5 disabled:text-[#121017]/30 focus:border-[#397565] focus:ring-4 focus:ring-[#397565]/10"
                name="category_id"
                data-category-filter
                disabled
              >
                <option value="">Overall event score</option>
              </select></label
            ><label
              ><span
                class="sr-only"
                >Find tribe</span
              ><span class="relative">
                <svg
                  class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 fill-none stroke-[#121017]/30 stroke-2"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="7" />
                  <path d="m20 20-4-4" />
                </svg>
                <input
                  class="h-11 w-full rounded-xl border border-[#121017]/10 bg-white pl-10 pr-3 text-xs font-bold outline-none placeholder:font-normal placeholder:text-[#121017]/30 focus:border-[#397565] focus:ring-4 focus:ring-[#397565]/10"
                  name="search"
                  maxlength="100"
                  placeholder="Search tribe name…"
                /> </span></label
            ><button class="sr-only" type="submit">Search</button>
          </form>
          <p
            class="mt-3 hidden text-xs font-bold text-[#FF6B2C]"
            data-filter-error
          ></p>
        </section>

        <section class="mt-10 hidden" data-top-performers aria-label="Top three tribes">
          <div class="mx-auto max-w-5xl" data-podium></div>
        </section>

        <section
          class="mt-10 overflow-hidden rounded-3xl border border-[#121017]/9 bg-white shadow-[0_18px_50px_rgba(18,16,23,.05)]"
        >
          <header
            class="flex flex-col gap-3 border-b border-[#121017]/7 px-5 py-5 sm:flex-row sm:items-end sm:justify-between sm:px-6"
          >
            <div>
              <p class="text-[9px] font-black uppercase tracking-[.15em] text-[#397565]">Full standings</p>
              <h2 class="mt-1 text-xl font-black" data-context-title>All events</h2>
              <p class="mt-1 text-xs text-[#121017]/42" data-context-subtitle>Cumulative results</p>
            </div>
            <span class="text-xs font-bold text-[#121017]/38" data-visible-count
              >0 tribes</span
            >
          </header>
          <div data-standings>
            <p class="px-6 py-16 text-center text-sm text-[#121017]/45">
              Loading standings…
            </p>
          </div>
        </section>
      </main>
    </div>
    <div
      class="pointer-events-none fixed right-4 top-4 z-[80] grid w-[min(380px,calc(100%_-_2rem))] gap-2.5"
      data-notification-region
    ></div>
    <script src="js/vendor/axios.min.js"></script>
    <script src="js/shared/navigation.js?v=20260917-7"></script>
    <script src="js/adviser/leaderboard.js?v=20260917-6"></script>
  </body>
</html>
