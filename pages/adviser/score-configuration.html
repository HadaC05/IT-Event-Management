<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><base href="../../">
  <title>Score Configuration | CITE Events</title><link rel="icon" type="image/png" href="assets/images/cite_favicon.png">
  <link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/adviser.css?v=20260917-flat-2">
  <script src="js/shared/notifications.js?v=20260917-7" defer></script>
</head>
<body class="app-shell min-h-screen bg-white font-sans text-[#121017] antialiased" data-admin-shell data-navigation-role="adviser">
  <div data-shared-navigation-host></div>
  <div class="min-h-screen lg:ml-20"><main class="admin-main mx-auto w-full max-w-6xl px-4 py-7 sm:px-6 lg:px-10 lg:py-9">
    <header class="flex items-center justify-between gap-4 border-b border-[#121017]/12 pb-5"><h1 class="text-xl font-black tracking-[-.035em] sm:text-2xl" data-event-title>Loading competition…</h1><a class="inline-flex min-h-10 shrink-0 items-center rounded-xl border border-[#397565]/25 px-4 text-xs font-black text-[#397565]" href="pages/adviser/leaderboard.html" data-leaderboard-link>Leaderboards</a></header>
    <div class="grid gap-6 py-6 lg:grid-cols-[minmax(280px,.7fr)_minmax(0,1.3fr)] lg:items-start">
      <aside class="rounded-2xl border border-[#121017]/10 bg-[#F3F0E9]/45 p-5 lg:sticky lg:top-24"><label class="grid gap-2"><span class="text-[10px] font-black uppercase tracking-[.16em] text-[#121017]/45">Find a competition</span><input class="h-12 rounded-xl border border-[#121017]/12 bg-white px-4 text-sm font-bold outline-none focus:border-[#397565]" type="search" placeholder="Search activity…" data-activity-search></label><label class="mt-3 grid gap-2"><span class="text-[10px] font-black uppercase tracking-[.16em] text-[#121017]/45">Filter by schedule</span><select class="h-11 w-full rounded-xl border border-[#121017]/12 bg-white px-4 text-sm font-bold outline-none focus:border-[#397565]" data-activity-schedule><option value="">All scheduled days</option></select></label><div class="mt-4 grid gap-2" data-activity-results></div><p class="mt-3 text-xs leading-5 text-[#121017]/50" data-activity-description></p></aside>
      <section class="min-w-0 pb-8" data-configuration><p class="py-10 text-center text-sm text-[#121017]/45">Loading scores…</p></section>
    </div>
  </main></div>
  <div class="pointer-events-none fixed right-4 top-4 z-[80] grid w-[min(380px,calc(100%_-_2rem))] gap-2.5" data-notification-region></div>
  <dialog class="m-auto rounded-2xl bg-white p-0 shadow-2xl backdrop:bg-[#121017]/65" style="width:min(680px,calc(100% - 2rem))" data-awards-dialog>
    <form data-placement-rules data-axios-form>
      <header class="flex items-start justify-between gap-4 border-b border-[#121017]/8 px-5 py-5 sm:px-6"><div><p class="text-[10px] font-black uppercase tracking-[.16em] text-[#397565]">Placement points</p><h2 class="mt-1 text-xl font-black">Set points</h2><p class="mt-1 text-xs text-[#121017]/45">Unlisted places receive zero points.</p></div><button class="grid h-9 w-9 place-items-center rounded-lg border text-lg" type="button" data-awards-close aria-label="Close points configuration">×</button></header>
      <div class="p-5 sm:p-6"><div class="mb-2 grid gap-3 text-[10px] font-black uppercase tracking-wide text-[#121017]/40" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr) 90px"><span>Place</span><span>Points</span><span class="text-center">Action</span></div><div class="grid gap-3" data-rule-list></div><button class="mt-4 text-xs font-black text-[#397565] hover:underline" type="button" data-add-rule>+ Add another place</button></div>
      <footer class="flex justify-end gap-2 border-t border-[#121017]/8 px-5 py-4 sm:px-6"><button class="min-h-11 rounded-xl border px-4 text-xs font-black" type="button" data-awards-close>Cancel</button><button class="min-h-11 rounded-xl bg-[#397565] px-5 text-xs font-black text-white" type="submit">Save awards</button></footer>
    </form>
  </dialog>
  <script src="js/vendor/axios.min.js"></script><script src="js/shared/password-gate.js?v=20260917-1"></script><script src="js/shared/navigation.js?v=20260925-media-student-1"></script><script src="js/adviser/score-configuration.js?v=20260923-schedule-2"></script>
</body></html>
