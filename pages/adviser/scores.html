<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../../" />
  <title>Manage Scores | CITE Events</title>
  <link rel="icon" type="image/png" href="assets/images/cite_favicon.png" />
  <link rel="stylesheet" href="css/tailwind.css" />
  <link rel="stylesheet" href="css/adviser.css?v=20260917-flat-2" />
  <script src="js/shared/notifications.js?v=20260917-7" defer></script>
  <script src="js/shared/interactions.js?v=20260917-flat-1" defer></script>
</head>
<body class="app-shell min-h-screen bg-white font-sans text-[#121017] antialiased" data-admin-shell data-navigation-role="adviser">
  <div data-page-loading-cloak aria-label="Loading Event Scoreboards"></div>
  <div data-shared-navigation-host></div>
  <div class="min-h-screen lg:ml-20">
    <main class="admin-main mx-auto w-full max-w-[1500px] px-4 py-7 sm:px-6 lg:px-10 lg:py-9 xl:px-16">
      <header class="border-b border-[#121017]/12 pb-7"><h1 class="text-3xl font-black tracking-[-.05em] sm:text-3xl">Event Scores</h1></header>
      <section class="py-8">
        <form class="flex flex-col gap-3 sm:flex-row sm:items-center" data-score-filters>
          <label class="relative min-w-0 flex-1"><span class="sr-only">Search events</span><svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 fill-none stroke-[#121017]/30 stroke-2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg><input class="h-11 w-full rounded-xl border border-[#121017]/10 bg-white pl-10 pr-4 text-sm outline-none focus:border-[#397565] focus:ring-4 focus:ring-[#397565]/8" name="search" placeholder="Search events" /></label>
          <label class="sr-only" for="event-status">Event status</label>
          <select id="event-status" name="timing" class="h-11 rounded-xl border border-[#121017]/10 bg-white px-4 text-sm font-semibold outline-none focus:border-[#397565] focus:ring-4 focus:ring-[#397565]/8"><option value="">All event statuses</option><option value="upcoming">Upcoming</option><option value="ongoing">Ongoing</option><option value="completed">Completed</option></select>
          <button class="hidden min-h-11 rounded-xl px-4 text-xs font-black text-[#FF6B2C] transition hover:bg-[#FF6B2C]/8" type="button" data-clear-filters>Clear filters</button>
          <button class="sr-only" type="submit">Apply filters</button>
        </form>
        <div class="mt-6 grid gap-5" data-event-list><p class="p-10 text-center text-sm text-[#121017]/45">Loading scoreboards…</p></div>
        <nav class="hidden items-center justify-between border-t border-[#121017]/8 px-5 py-4 text-[10px] sm:px-6" data-pagination></nav>
      </section>
    </main>
  </div>
  <div class="pointer-events-none fixed right-4 top-4 z-[80] grid w-[min(380px,calc(100%_-_2rem))] gap-2.5" data-notification-region></div>
  <script src="js/vendor/axios.min.js"></script>
  <script src="js/shared/password-gate.js?v=20260917-1"></script>
  <script src="js/shared/navigation.js?v=20260925-media-student-1"></script>
  <script src="js/adviser/scores.js?v=20260923-event-search-4"></script>
</body>
</html>
