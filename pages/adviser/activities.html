<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../">
  <title>Activity Management | CITE Events</title><link rel="icon" href="assets/images/cite_favicon.png">
  <link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/adviser.css">
  <script src="js/shared/notifications.js" defer></script><script src="js/shared/interactions.js" defer></script>
</head><body class="app-shell min-h-screen bg-white font-sans text-[#121017] antialiased" data-admin-shell data-navigation-role="adviser">
  <span class="route-progress" data-route-progress data-active="false"></span><div data-page-loading-cloak aria-label="Loading Activity Management"></div><div data-shared-navigation-host></div>
  <div class="min-h-screen lg:ml-20"><main class="admin-main mx-auto w-full max-w-[1500px] px-4 py-7 sm:px-6 lg:px-10 lg:py-9 xl:px-16">
    <header class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between"><div><p class="text-xs font-black uppercase tracking-[.14em] text-[#397565]">Event management</p><h1 class="mt-2 text-4xl font-black tracking-[-.05em] sm:text-3xl">Activities</h1></div><button class="min-h-12 rounded-xl bg-[#397565] px-5 text-sm font-black text-white shadow-lg" type="button" data-open-activity>+ Add Activity</button></header>
    <section class="mt-7 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"><header class="border-b border-slate-100 p-4 sm:p-5"><div class="flex items-end justify-between gap-3"><div><h2 class="mt-1 text-xl font-black">Available activities</h2><p class="mt-1 text-xs text-slate-400" data-activity-count>Loading activities...</p></div><button class="hidden text-xs font-black text-[#FF6B2C]" type="button" data-clear-activity-filters>Clear filters</button></div><form class="mt-5 flex flex-col gap-3 sm:flex-row" data-activity-filters><label class="relative min-w-0 flex-1"><span class="sr-only">Search activities</span><svg class="absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 fill-none stroke-slate-400 stroke-2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50 pl-10 pr-3 text-sm outline-none focus:border-[#397565] focus:bg-white" name="search" maxlength="100" placeholder="Search activity name or description..."></label><label class="sm:w-60"><span class="sr-only">Filter by event type</span><select class="h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm" name="event_type_id"><option value="">All event types</option></select></label></form></header>
      <div class="overflow-x-auto"><table class="w-full min-w-[650px] border-collapse text-left"><thead class="bg-slate-50 text-[10px] font-extrabold uppercase tracking-wider text-slate-400"><tr><th class="px-5 py-3.5">Activity</th><th class="px-4 py-3.5">Event type</th><th class="px-5 py-3.5 text-right">Action</th></tr></thead><tbody class="divide-y divide-slate-100" data-activity-rows></tbody></table></div><nav class="hidden items-center justify-between gap-4 border-t border-slate-100 px-5 py-4 text-xs" data-activity-pagination></nav>
    </section>
  </main></div>
  <dialog class="m-auto w-[min(560px,calc(100%_-_2rem))] rounded-2xl border-0 bg-white p-0 shadow-2xl backdrop:bg-[#121017]/60" data-activity-dialog><form class="p-5 sm:p-7" data-activity-form><input type="hidden" name="id"><input type="hidden" name="action" value="create"><header class="mb-6 flex items-start justify-between gap-4"><div><p class="text-xs font-black uppercase tracking-wider text-[#397565]">Activity catalog</p><h2 class="mt-1 text-2xl font-black" data-activity-dialog-title>Add Activity</h2><p class="mt-1 text-sm text-[#121017]/50" data-activity-dialog-description>This activity will be available under its event type.</p></div><button class="grid h-10 w-10 place-items-center rounded-xl bg-slate-100 text-xl" type="button" data-close-activity aria-label="Close">&times;</button></header><div class="grid gap-4"><label class="grid gap-2"><span class="text-xs font-bold">Event type <i class="text-rose-500">*</i></span><select class="h-11 rounded-xl border border-slate-200 bg-white px-3 text-sm disabled:bg-slate-100" name="event_type_id" required><option value="">Select event type</option></select><small class="hidden text-xs text-slate-400" data-event-type-locked>Event type cannot be changed after an activity is created.</small></label><label class="grid gap-2"><span class="text-xs font-bold">Activity name <i class="text-rose-500">*</i></span><input class="h-11 rounded-xl border border-slate-200 px-3 text-sm" name="label" maxlength="120" required placeholder="e.g. Programming Competition"></label><label class="grid gap-2"><span class="text-xs font-bold">Description <small class="font-normal text-slate-400">Optional</small></span><textarea class="min-h-28 rounded-xl border border-slate-200 p-3 text-sm" name="description" maxlength="2000" placeholder="Briefly describe this activity..."></textarea></label></div><footer class="mt-6 flex justify-end gap-3"><button class="min-h-11 rounded-xl px-4 text-sm font-bold text-slate-500" type="button" data-close-activity>Cancel</button><button class="min-h-11 rounded-xl bg-[#397565] px-5 text-sm font-black text-white" type="submit" data-save-activity>Create Activity</button></footer></form></dialog>
  <script src="js/vendor/axios.min.js"></script><script src="js/shared/password-gate.js"></script><script src="js/shared/navigation.js"></script><script src="js/adviser/activities.js"></script>
</body></html>
